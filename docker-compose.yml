version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_ecommerce
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/workflows

  resilience-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resilience_bridge
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    env_file:
      - .env

volumes:
  n8n_data:
